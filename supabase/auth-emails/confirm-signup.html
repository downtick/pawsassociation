<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Confirm your email</title></head>
<body style="font-family:Arial,sans-serif;background:#FBF9FE;margin:0;padding:20px">
  <div style="max-width:600px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(45,25,85,0.10)">
    <div style="background:linear-gradient(135deg,#1D4ED8,#1F1730);padding:28px 32px;border-bottom:3px solid #2563EB">
      <p style="color:#2563EB;margin:0;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:700">PAWS</p>
      <h1 style="color:#fff;margin:8px 0 0;font-size:21px">Confirm your email</h1>
    </div>
    <div style="padding:28px 32px;color:#4C405F;font-size:15px;line-height:1.6">
      <p>Welcome to PAWS. Confirm your email address to activate your account.</p>
      <p style="margin:26px 0">
        <a href="{{ .ConfirmationURL }}" style="background:#2563EB;color:#ffffff;text-decoration:none;font-weight:700;padding:13px 24px;border-radius:10px;display:inline-block">Confirm my email</a>
      </p>
      <p style="color:#665B7A;font-size:13px">If you didn't create an account, you can ignore this email.</p>
      <p style="color:#665B7A;font-size:13px">If the button doesn't work, copy and paste this link into your browser:<br>
        <span style="color:#2563EB;word-break:break-all">{{ .ConfirmationURL }}</span>
      </p>
    </div>
    <div style="background:#FBF9FE;padding:16px 32px;font-size:12px;color:#665B7A;border-top:1px solid #E6DEF4">
      PAWS.com
    </div>
  </div>
</body>
</html>
